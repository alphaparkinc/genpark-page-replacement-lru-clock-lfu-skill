[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-page-replacement-lru-clock-lfu-skill"
version = "1.0.0"
description = "Virtual memory page replacement algorithms: Least Recently Used (LRU) and Second-Chance Clock algorithm."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AlphaPark Team", email = "engineering@alphapark.ai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Operating System"
]

[project.urls]
Homepage = "https://github.com/alphaparkinc/genpark-page-replacement-lru-clock-lfu-skill"
Repository = "https://github.com/alphaparkinc/genpark-page-replacement-lru-clock-lfu-skill.git"
Issues = "https://github.com/alphaparkinc/genpark-page-replacement-lru-clock-lfu-skill/issues"
